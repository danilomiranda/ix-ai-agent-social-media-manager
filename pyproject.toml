[project]
name = "ix-pipeline"
version = "0.1.0"
description = "Python CV + transcription tools for the IX pipeline"
requires-python = ">=3.11"
dependencies = [
  "mediapipe>=0.10.14",
  "opencv-contrib-python>=4.9.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "filterpy>=1.4.4",
  "rapidfuzz>=3.0.0",
  "whisperx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "python*"]
